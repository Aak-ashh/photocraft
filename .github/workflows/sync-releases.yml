name: Sync Releases from Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and Push Upstream Tags
        run: |
          # Pull all release tags from the original repo into your fork
          git remote add upstream https://github.com/storytold/photocraft.git
          git fetch upstream --tags
          git push origin --tags

      - name: Fetch and Sync Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: storytold/photocraft
        run: |
          UPSTREAM_RELEASES=$(gh api repos/$UPSTREAM_REPO/releases)

          echo "$UPSTREAM_RELEASES" | jq -c '.[]' | while read -r release; do
            TAG=$(echo "$release" | jq -r '.tag_name')
            NAME=$(echo "$release" | jq -r '.name // empty')
            BODY=$(echo "$release" | jq -r '.body // empty')
            PRERELEASE=$(echo "$release" | jq -r '.prerelease')
            DRAFT=$(echo "$release" | jq -r '.draft')

            if [ "$DRAFT" = "true" ]; then
              continue
            fi

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists in fork. Skipping."
              continue
            fi

            echo "Syncing release: $TAG"
            rm -rf ./downloads
            mkdir -p ./downloads

            echo "$release" | jq -r '.assets[]?.browser_download_url' | while read -r url; do
              if [ -n "$url" ]; then
                wget -q -P ./downloads "$url"
              fi
            done

            ARGS=()
            [ "$PRERELEASE" = "true" ] && ARGS+=(--prerelease)
            [ -n "$NAME" ] && ARGS+=(-t "$NAME")
            [ -n "$BODY" ] && ARGS+=(-n "$BODY")

            if [ -d "./downloads" ] && [ "$(ls -A ./downloads)" ]; then
              gh release create "$TAG" ./downloads/* "${ARGS[@]}"
            else
              gh release create "$TAG" "${ARGS[@]}"
            fi

            rm -rf ./downloads
          done
